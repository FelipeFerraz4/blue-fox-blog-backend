spring:
  config:
    activate:
      on-profile: test

  application:
    name: Backend

  datasource:
    url: jdbc:postgresql://localhost:5432/blue-fox-aquarium-api-test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
