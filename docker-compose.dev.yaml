services:
  postgres:
    ports:
      - "${DB_PORT:-5432}:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:dev
    environment:
      NODE_ENV: development
      SWAGGER_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-8081}:${BACKEND_PORT:-8081}"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./logs:/app/logs
